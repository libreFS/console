<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <rect width="280" height="280" fill="#0d1b2a"/>

  <!-- Three fading bars — staggered pulse animation -->
  <rect x="80" y="88" width="120" height="28" rx="14" fill="#0ea5e9">
    <animate attributeName="opacity"
      values="1;0.2;1" dur="1.5s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="80" y="126" width="120" height="28" rx="14" fill="#0ea5e9" opacity="0.55">
    <animate attributeName="opacity"
      values="0.55;1;0.55;0.15;0.55" dur="1.5s" begin="0.25s" repeatCount="indefinite"/>
  </rect>
  <rect x="80" y="164" width="120" height="28" rx="14" fill="#0ea5e9" opacity="0.22">
    <animate attributeName="opacity"
      values="0.22;0.55;0.22;1;0.22" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
</svg>
