name: Release

# Triggers on version tags: v1.7.7, v1.8.0, etc.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub Release + upload assets
  packages: write   # push to GHCR

jobs:
  # ── Job 1: build frontend assets (shared across all Go builds) ───────────
  frontend:
    name: Build frontend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: web-app/yarn.lock

      - name: Install and build
        working-directory: web-app
        run: yarn install && yarn build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web-app/build/
          retention-days: 1

  # ── Job 2: cross-compile Go binary for each platform ─────────────────────
  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_suffix: ''
          - goos: linux
            goarch: arm64
            asset_suffix: ''
          - goos: darwin
            goarch: amd64
            asset_suffix: ''
          - goos: darwin
            goarch: arm64
            asset_suffix: ''
          - goos: windows
            goarch: amd64
            asset_suffix: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: web-app/build/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build binary
        env:
          BINARY: console-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.asset_suffix }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath --tags=kqueue --ldflags "-s -w" \
            -o "$BINARY" ./cmd/console
          sha256sum "$BINARY" > "${BINARY}.sha256sum"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            console-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.asset_suffix }}
            console-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.asset_suffix }}.sha256sum
          retention-days: 1

  # ── Job 3: Docker image ───────────────────────────────────────────────────
  docker:
    name: Docker image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: web-app/build/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/librefs/console
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: GitHub Release ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            console-linux-amd64
            console-linux-amd64.sha256sum
            console-linux-arm64
            console-linux-arm64.sha256sum
            console-darwin-amd64
            console-darwin-amd64.sha256sum
            console-darwin-arm64
            console-darwin-arm64.sha256sum
            console-windows-amd64.exe
            console-windows-amd64.exe.sha256sum
